name: Independent Winkler verification
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/verification/**"
      - ".github/workflows/verify-independent.yml"
permissions:
  contents: read
jobs:
  opensees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libblas3 liblapack3 libgfortran5 libgomp1
      - run: python -m pip install -r scripts/verification/requirements.txt
      - run: npx vite-node scripts/verification/export-winkler.ts
      - run: python scripts/verification/opensees-winkler.py
      - run: npx vite-node scripts/verification/check-winkler.ts
