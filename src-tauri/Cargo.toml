[package]
name = "molasstruct"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Estimativa de molas de fundação - OpenStruct"
authors = ["OpenStruct contributors"]

[lib]
name = "molasstruct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
molas-core = { path = "../crates/molas-core" }
# Consulta do catálogo assinado e download conferido das atualizações (issue #1).
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
